name: Build Windows

# Builds the native Windows installers (NSIS .exe + MSI) that can't be
# cross-built from WSL. Download them from a run's artifacts, or push a `v*`
# tag to also cut a GitHub Release with the installers attached.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - src-tauri/**
      - package.json
      - package-lock.json
      - index.html
      - vite.config.ts
      - tsconfig*.json
      - .github/workflows/build-windows.yml
    tags: ["v*"]

# A newer push to the same ref supersedes an in-flight build.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create a Release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # cache-bin off: with it on, the post step deletes every regular file that was in ~/.cargo/bin
      # when the job started (getCargoBins/cleanBin) — rustup itself. Harmless on a throwaway hosted
      # VM; on a self-hosted runner, whose home persists, it leaves every later job without rustup.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: "false"

      - run: npm ci

      - name: Build installers
        run: npm run tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: repo-launcher-windows-installers
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
